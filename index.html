<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>给老婆的浪漫倒计时 ❤️ 爱你哦</title>
	
	<script>
        // 这段脚本会在页面加载时检查是否需要刷新
        (function() {
            // 从 localStorage 获取上次加载的时间戳
            var lastVersion = localStorage.getItem('blog_version');
            var currentVersion = '20240308'; // 你可以随便改个数字，比如今天的日期
            
            // 如果没有记录，或者记录和现在不一样，就强制刷新
            if (!lastVersion || lastVersion !== currentVersion) {
                localStorage.setItem('blog_version', currentVersion);
                // 使用 replace 方法刷新，避免产生历史记录
                window.location.reload(true);
            }
        })();
    </script>
	
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #f5f0ff 0%, #fad0d9 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.85);
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 3rem 2rem;
            max-width: 800px;
            width: 90%;
            backdrop-filter: blur(5px);
            border: 2px solid #ffb6c1;
        }
        h1 {
            color: #d44e6c;
            font-size: 2.5rem;
            margin-top: 0;
            margin-bottom: 1rem;
            letter-spacing: 2px;
        }
        .heart {
            font-size: 4rem;
            margin: 0.5rem 0;
            animation: heartbeat 1.5s ease-in-out infinite;
        }
        @keyframes heartbeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.3); }
            28% { transform: scale(1); }
            42% { transform: scale(1.3); }
            70% { transform: scale(1); }
        }
        .countdown {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
            margin: 2.5rem 0;
        }
        .time-block {
            background: #fff;
            border-radius: 20px;
            padding: 1.5rem 1rem;
            min-width: 100px;
            box-shadow: 0 10px 20px rgba(209, 71, 103, 0.2);
            border: 1px solid #ffb6c1;
        }
        .time-number {
            font-size: 4rem;
            font-weight: bold;
            color: #d44e6c;
            line-height: 1.2;
        }
        .time-label {
            font-size: 1.2rem;
            color: #a65a6b;
            margin-top: 0.5rem;
            letter-spacing: 2px;
        }
        .message {
            font-size: 1.5rem;
            color: #a1445c;
            margin-top: 2rem;
            font-style: italic;
            border-top: 2px dashed #ffb6c1;
            padding-top: 1.5rem;
        }
        .footer {
            margin-top: 2rem;
            color: #b36b7a;
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>亲爱的老婆VickyDu</h1>
        <div class="heart">❤️</div>
        <!-- 给这行文字加个id，方便控制隐藏/显示 -->
        <p id="countdown-text" style="font-size:1.3rem; color:#b35d74;">距离你的生日还有……</p>
        
        <div class="countdown" id="countdown-blocks">
            <div class="time-block">
                <div class="time-number" id="days">00</div>
                <div class="time-label">天</div>
            </div>
            <div class="time-block">
                <div class="time-number" id="hours">00</div>
                <div class="time-label">小时</div>
            </div>
            <div class="time-block">
                <div class="time-number" id="minutes">00</div>
                <div class="time-label">分钟</div>
            </div>
            <div class="time-block">
                <div class="time-number" id="seconds">00</div>
                <div class="time-label">秒</div>
            </div>
        </div>

        <div class="message" id="message">
            每一天都在期待着为你庆祝的日子，感谢老婆支持我，包容我。 ✨
        </div>
        <div class="footer">
            —— 爱你的DarlingZhou
        </div>
    </div>

    <script>
        // ========== 在这里设置你老婆的生日（月份和日期） ==========
        // 注意：月份从0开始计数（0=一月，1=二月，...，11=十二月）
        // 你当前设置的是 month=2, day=10  → 3月10日
        const birthdayMonth = 2;    // 3月
        const birthdayDay = 10;      // 10号

        function updateDisplay() {
            const now = new Date();
            const todayYear = now.getFullYear();
            const todayMonth = now.getMonth();
            const todayDate = now.getDate();

            // 判断今天是不是生日（只比较月、日）
            const isBirthdayToday = (todayMonth === birthdayMonth && todayDate === birthdayDay);
			// test 
			//const isBirthdayToday = true

            // 获取要控制显示/隐藏的元素
            const countdownText = document.getElementById('countdown-text');
            const countdownBlocks = document.getElementById('countdown-blocks');
            const messageDiv = document.getElementById('message');

            if (isBirthdayToday) {
                // 生日当天：隐藏倒计时相关元素，只显示生日祝福
                countdownText.style.display = 'none';
                countdownBlocks.style.display = 'none';
                messageDiv.textContent = "老婆生日快乐！愿你每天平安喜乐，幸福安康，有幸此生有你相伴，永远爱你！";
            } else {
                // 非生日：显示倒计时，并计算下一个生日
                countdownText.style.display = 'block';
                countdownBlocks.style.display = 'flex';

                // 确定下一个生日的年份
                let nextBirthdayYear = todayYear;
                // 如果今年的生日已过（先比月，再比日），则目标年份为明年
                if (todayMonth > birthdayMonth || (todayMonth === birthdayMonth && todayDate > birthdayDay)) {
                    nextBirthdayYear = todayYear + 1;
                }

                // 下一个生日的零点
                const nextBirthday = new Date(nextBirthdayYear, birthdayMonth, birthdayDay, 0, 0, 0);
                const diffMs = nextBirthday - now; // 毫秒差

                // 防御性代码：万一出现负数（极少数边界情况），强行修正为明年
                if (diffMs < 0) {
                    // 直接取明年生日重新计算
                    const fallbackBirthday = new Date(nextBirthdayYear + 1, birthdayMonth, birthdayDay, 0, 0, 0);
                    diffMs = fallbackBirthday - now;
                }

                const diffSeconds = Math.floor(diffMs / 1000);
                const days = Math.floor(diffSeconds / (3600 * 24));
                const hours = Math.floor((diffSeconds % (3600 * 24)) / 3600);
                const minutes = Math.floor((diffSeconds % 3600) / 60);
                const seconds = Math.floor(diffSeconds % 60);

                // 更新数字（补零）
                document.getElementById('days').textContent = days.toString().padStart(2, '0');
                document.getElementById('hours').textContent = hours.toString().padStart(2, '0');
                document.getElementById('minutes').textContent = minutes.toString().padStart(2, '0');
                document.getElementById('seconds').textContent = seconds.toString().padStart(2, '0');

                // 恢复日常祝福语
                messageDiv.textContent = "每一天都在期待着为你庆祝的日子，感谢老婆支持我，包容我。";
            }
        }

        // 立即执行一次，每秒更新
        updateDisplay();
        setInterval(updateDisplay, 1000);
    </script>
</body>
</html>
